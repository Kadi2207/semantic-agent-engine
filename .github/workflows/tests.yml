name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          # torch en version CPU d'abord (index PyTorch CPU), puis le reste de requirements.txt
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # Le modele fine-tune et les caches Groq ne sont pas versionnes : les tests qui en ont besoin sont ignores
      # (pytest.mark.skipif), tous les autres tournent. Aucune cle, aucun appel reseau au LLM (tests/conftest.py).
      - name: Tests
        run: python -m pytest -q -rs
